<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0a1f"/>
      <stop offset="55%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#2a1245"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f5e6a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5e6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff9d3a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff9d3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6d4ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#b983ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b983ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Night sky background -->
  <rect width="1200" height="320" fill="url(#nightSky)"/>

  <!-- Twinkling stars scattered across the sky -->
  <g fill="#ffffff">
    <circle cx="90" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="24" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="140" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="28" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="200" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="170" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon -->
  <circle cx="600" cy="65" r="80" fill="url(#moonGlow)"/>
  <circle cx="600" cy="65" r="34" fill="#f6ecc9"/>
  <circle cx="588" cy="55" r="4" fill="#e3d5a8" opacity="0.6"/>
  <circle cx="610" cy="72" r="6" fill="#e3d5a8" opacity="0.5"/>
  <circle cx="596" cy="78" r="3" fill="#e3d5a8" opacity="0.5"/>

  <!-- ===== LEFT SIDE : old-fashioned hanging lantern lights ===== -->
  <path d="M20,45 Q210,150 390,80" stroke="#4a3524" stroke-width="2" fill="none" opacity="0.8"/>
  <g>
    <!-- Each lantern: outer glow + wire drop + bulb -->
    <g>
      <line x1="55" y1="55" x2="55" y2="70" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="55" cy="78" r="16" fill="url(#lanternGlow)"/>
      <circle cx="55" cy="78" r="6" fill="#ffe3a3">
        <animate attributeName="r" values="5.5;6.5;5.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <line x1="115" y1="90" x2="115" y2="105" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="115" cy="113" r="16" fill="url(#lanternGlow)"/>
      <circle cx="115" cy="113" r="6" fill="#ffe3a3">
        <animate attributeName="r" values="5.5;6.5;5.5" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <line x1="180" y1="112" x2="180" y2="127" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="180" cy="135" r="17" fill="url(#lanternGlow)"/>
      <circle cx="180" cy="135" r="6.5" fill="#ffe3a3">
        <animate attributeName="r" values="6;7;6" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <line x1="245" y1="118" x2="245" y2="133" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="245" cy="141" r="16" fill="url(#lanternGlow)"/>
      <circle cx="245" cy="141" r="6" fill="#ffe3a3">
        <animate attributeName="r" values="5.5;6.5;5.5" dur="2.3s" begin="0.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="2.3s" begin="0.15s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <line x1="305" y1="107" x2="305" y2="122" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="305" cy="130" r="16" fill="url(#lanternGlow)"/>
      <circle cx="305" cy="130" r="6" fill="#ffe3a3">
        <animate attributeName="r" values="5.5;6.5;5.5" dur="1.9s" begin="0.45s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.9s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <line x1="355" y1="88" x2="355" y2="103" stroke="#4a3524" stroke-width="1.5"/>
      <circle cx="355" cy="111" r="15" fill="url(#lanternGlow)"/>
      <circle cx="355" cy="111" r="5.5" fill="#ffe3a3">
        <animate attributeName="r" values="5;6;5" dur="2.0s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2.0s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ===== CENTER : witch/wizard flying on a broomstick across the moon ===== -->
  <g>
    <g id="rider">
      <!-- flowing cape -->
      <path d="M -34,-6 Q -58,4 -50,26 Q -30,14 -14,10 Z" fill="#241a3d" opacity="0.92"/>
      <!-- broom handle -->
      <line x1="-30" y1="12" x2="30" y2="-6" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
      <!-- broom twigs -->
      <path d="M22,-8 L46,-14 M22,-6 L47,-8 M22,-4 L45,-1 M22,-2 L44,6" stroke="#a67c3d" stroke-width="2" stroke-linecap="round"/>
      <!-- seated cloaked figure -->
      <ellipse cx="-8" cy="-2" rx="13" ry="16" fill="#2c1f4a"/>
      <path d="M -19,-14 Q -8,-30 3,-14 Q -8,-8 -19,-14 Z" fill="#2c1f4a"/>
      <circle cx="-9" cy="-16" r="6" fill="#e8c9a3"/>
    </g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M 380,150 Q 620,80 900,170 Q 1000,195 1120,150" rotate="auto"/>
  </g>

  <!-- ===== RIGHT SIDE : spell-casting animation ===== -->
  <g>
    <!-- standing spellcaster silhouette -->
    <path d="M1040,300 L1040,230 Q1040,205 1055,205 Q1070,205 1070,230 L1070,300 Z" fill="#241a3d"/>
    <circle cx="1055" cy="192" r="12" fill="#241a3d"/>
    <path d="M1043,183 Q1055,160 1068,183 Q1055,175 1043,183 Z" fill="#241a3d"/>
    <!-- wand -->
    <line x1="1070" y1="215" x2="1110" y2="185" stroke="#5a3d20" stroke-width="3" stroke-linecap="round"/>

    <!-- wand tip glow -->
    <circle cx="1112" cy="183" r="10" fill="url(#sparkGlow)" filter="url(#softBlur)">
      <animate attributeName="r" values="8;14;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- sparkle particles bursting outward -->
    <g fill="#e6d4ff">
      <circle cx="1112" cy="183" r="2.5">
        <animateMotion path="M0,0 L40,-45" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="183" r="2">
        <animateMotion path="M0,0 L55,-10" dur="1.7s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.7s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="183" r="2.2">
        <animateMotion path="M0,0 L35,30" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="183" r="1.8">
        <animateMotion path="M0,0 L60,20" dur="1.9s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.9s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="183" r="2.4">
        <animateMotion path="M0,0 L15,-55" dur="1.3s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.3s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1112" cy="183" r="2">
        <animateMotion path="M0,0 L48,-35" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- tiny four-point stars twinkling around the burst -->
    <g fill="#ffd700">
      <path d="M1130,150 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z">
        <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M1095,210 l1.6,5 l5,1.6 l-5,1.6 l-1.6,5 l-1.6,-5 l-5,-1.6 l5,-1.6 z">
        <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
